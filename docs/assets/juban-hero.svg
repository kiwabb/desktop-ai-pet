<text x="70" y="191" font-size="88" font-weight="700" letter-spacing="8">橘伴</text>
<text x="76" y="247" font-size="27">一只白猫，陪你把日常慢慢理清。</text>
<text x="76" y="287" font-size="17" fill="#886e59">桌面上的小小陪伴，电脑里的日常记忆。</text>
