<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠预览</title>
    <style>
      body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #3b4a63, #1a2233 70%); display: grid; place-items: center; font-family: -apple-system, sans-serif; }
      .preview-wrap { position: relative; width: 232px; height: 380.9px; }
      .preview-wrap .desktop-pet-app { position: absolute; inset: 0; }
      nav { position: absolute; bottom: -52px; left: 50%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 460px; transform: translateX(-50%); }
      nav button { border: 1px solid #ffffff28; border-radius: 999px; padding: 8px 14px; color: white; background: #ffffff12; cursor: pointer; }
      nav button:hover { background: #ffffff20; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/qa/pet-preview.tsx"></script>
  </body>
</html>
