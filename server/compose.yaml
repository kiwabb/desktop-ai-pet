name: desktop-pet-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pet_agent
      POSTGRES_USER: pet_agent
      POSTGRES_PASSWORD: ${PET_AGENT_POSTGRES_PASSWORD:?Set a private database password in .env}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet_agent -d pet_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
